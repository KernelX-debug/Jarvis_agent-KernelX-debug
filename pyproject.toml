[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-agent-local"
version = "0.2.0"
description = "Agente de voz local, extensible y seguro para automatizar tareas del sistema."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "KernelX contributors" }]
keywords = ["voice-assistant", "offline", "whisper", "ollama", "huggingface", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
voice = [
  "faster-whisper>=1.1,<2",
  "numpy>=1.26,<3",
  "sounddevice>=0.5,<1",
  "pyttsx3>=2.90,<3",
]
automation = ["pyautogui>=0.9.54,<1", "pyperclip>=1.9,<2"]
hub = ["huggingface-hub>=0.27,<2"]
llm-hf = [
  "accelerate>=1,<2",
  "transformers>=4.47,<6",
  "torch>=2.2",
]
pdf = ["pypdf>=5,<7"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1"]
all = [
  "faster-whisper>=1.1,<2",
  "numpy>=1.26,<3",
  "sounddevice>=0.5,<1",
  "pyttsx3>=2.90,<3",
  "pyautogui>=0.9.54,<1",
  "pyperclip>=1.9,<2",
  "huggingface-hub>=0.27,<2",
  "accelerate>=1,<2",
  "transformers>=4.47,<6",
  "torch>=2.2",
  "pypdf>=5,<7",
]

[project.scripts]
jarvis = "jarvis_agent.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jarvis_agent.resources" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
